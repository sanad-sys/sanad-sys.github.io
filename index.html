<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>سند · SANAD</title>
<meta name="description" content="نظام سند لإدارة المقاصف">
<meta name="theme-color" content="#FAF8F3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سند">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#FAF8F3;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:#12201C}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#FAF8F3}
#splash{position:fixed;inset:0;z-index:5;background:#FAF8F3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
#splash .s{stroke-dasharray:100;stroke-dashoffset:100;animation:dr .7s .3s cubic-bezier(.5,0,.2,1) forwards}
#splash .a{stroke-dasharray:100;stroke-dashoffset:100;animation:dr .5s 1.3s cubic-bezier(.5,0,.2,1) forwards}
#splash .bg{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(1.4);animation:bgi .5s .55s cubic-bezier(.2,.8,.2,1) forwards}
#splash .u{opacity:0;transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:gr .45s cubic-bezier(.2,.8,.2,1) forwards}
#splash .q{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s 1.7s cubic-bezier(.3,1.8,.5,1) forwards}
#splash .wm{margin-top:18px;font-family:'Michroma',system-ui,sans-serif;font-size:clamp(22px,8vw,30px);letter-spacing:.18em;color:#0B5D4B;direction:ltr;opacity:0;animation:fi .5s 2.1s forwards}
#splash .sy{font-family:'Michroma',system-ui,sans-serif;font-size:8px;letter-spacing:.4em;color:#5C6B66;display:flex;align-items:center;gap:8px;margin-top:6px;opacity:0;animation:fi .4s 2.5s forwards}
#splash .sy i{display:block;width:22px;height:1px;background:#C9A24D}
#splash .pb{width:160px;height:3px;background:#E7E2D6;border-radius:2px;margin-top:22px;overflow:hidden}
#splash .pb i{display:block;height:3px;width:0;border-radius:2px;background:#B9E4CF;animation:ld 3.2s .4s cubic-bezier(.2,.6,.3,1) forwards}
#splash .pc{margin:6px 0 0;font-size:12.5px;color:#5C6B66}
#splash .ft{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;opacity:0;animation:fi .5s 2.8s forwards}
#splash .ft small{display:block;font-family:'Michroma',system-ui,sans-serif;font-size:7px;letter-spacing:.35em;color:#8A958F;direction:ltr}
#splash .ft b{display:block;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:21px;color:#0B5D4B;line-height:1.3}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}@keyframes gr{to{opacity:1;transform:scaleY(1)}}@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes bgi{to{opacity:1;transform:scale(1)}}
@keyframes ld{0%{width:0}70%{width:78%;background:#C9A24D}100%{width:92%;background:#0B5D4B}}
#splash.done .pb i{width:100%!important;background:#0B5D4B;transition:width .3s}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;max-width:480px;margin:0 auto;background:#12201C;color:#FAF8F3;border-radius:18px;padding:14px 16px;display:none;align-items:center;gap:12px;font-size:14px;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.bar.show{display:flex}
.bar img{width:40px;height:40px;border-radius:11px;flex:none}
.bar span{flex:1}
.bar button{height:40px;padding:0 14px;border:none;border-radius:12px;font-family:inherit;font-size:14px;cursor:pointer;flex:none}
.bar .go{background:#0B5D4B;color:#fff;font-weight:600}
.bar .x{background:transparent;color:#B9E4CF;padding:0 6px}
#off{position:fixed;inset:0;z-index:6;background:#FAF8F3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#off.show{display:flex}
#off img{width:72px;height:72px}
#off b{font-size:18px}#off p{margin:0;color:#5C6B66;font-size:14px;line-height:1.7}
#off button{height:48px;padding:0 24px;border:none;border-radius:14px;background:#0B5D4B;color:#fff;font-family:inherit;font-size:15px}
/* v7.3: لوحة تفعيل إشعارات الجوال (الإذن لازم يكون من الصفحة الأم وبضغطة من المستخدم) */
#psh{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:flex-end;background:rgba(10,25,20,.45)}
#psh.show{display:flex}
#psh .pn{background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));text-align:center;font-family:'Readex Pro',system-ui,sans-serif;color:#12201C;animation:pu .25s ease-out}
@keyframes pu{from{transform:translateY(100%)}to{transform:none}}
#psh .bl{font-size:42px;line-height:1}#psh h3{margin:10px 0 6px;font-size:18px}#psh p{margin:0 0 18px;color:#5C6B66;font-size:14px;line-height:1.7}
#psh button{display:block;width:100%;height:52px;border-radius:16px;border:none;font:inherit;font-size:16px;font-weight:600}
#psh .y{background:#0B5D4B;color:#fff}#psh .n{background:none;color:#5C6B66;margin-top:6px;font-weight:400}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<div id="splash" aria-label="سند">
  <svg width="110" height="110" viewBox="0 0 120 120" aria-hidden="true">
    <rect class="bg" width="120" height="120" rx="30" fill="#0B5D4B"/>
    <path class="s" pathLength="100" d="M60 14L96 27V54C96 79 81 94 60 106 39 94 24 79 24 54V27Z" stroke="#B9E4CF" stroke-width="7" stroke-linejoin="round" fill="none"/>
    <rect class="u" style="animation-delay:.9s" x="38" y="70" width="11" height="14" rx="2.5" fill="#F0997B"/>
    <rect class="u" style="animation-delay:1.02s" x="54.5" y="60" width="11" height="24" rx="2.5" fill="#FAC775"/>
    <rect class="u" style="animation-delay:1.14s" x="71" y="50" width="11" height="34" rx="2.5" fill="#9FE1CB"/>
    <path class="a" pathLength="100" d="M34 64L50 52 62 56 84 34" stroke="#FAF8F3" stroke-width="5" stroke-linejoin="miter" fill="none"/>
    <path class="q" d="M95 23L88.6 39.2 78.7 29.3Z" fill="#FAF8F3"/>
  </svg>
  <div class="wm">SANAD</div>
  <div class="sy"><i></i>SYSTEM<i></i></div>
  <div class="pb"><i></i></div>
  <p class="pc" id="pc">جاري فتح سند…</p>
  <div class="ft"><small>CRAFTED BY</small><b>أبو سند</b></div>
</div>
<div id="off" role="alert"><img src="icon-192.png" alt=""><b>ما فيه اتصال</b><p>تأكد من النت وارجع جرّب.<br>اللي سجلته قبل محفوظ في جوالك.</p><button type="button" onclick="location.reload()">جرّب مرة ثانية</button></div>
<div class="bar" id="ins" role="dialog" aria-label="تثبيت سند"><img src="icon-192.png" alt=""><span id="insT">ثبّت سند على جوالك عشان يفتح مثل التطبيق</span><button class="go" id="insGo" type="button">تثبيت</button><button class="x" id="insX" type="button" aria-label="إغلاق">✕</button></div>

<div id="psh" role="dialog" aria-modal="true"><div class="pn"><div class="bl">🔔</div><h3 id="pshT"></h3><p id="pshP"></p><button class="y" id="pshY"></button><button class="n" id="pshN"></button></div></div>
<script>
(function () {
  'use strict';
  /* ═══ الرابط الرسمي لنظام سند — ما يتغير ═══ */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyGpZXFoPyezeBBB3hAcnxDYJXw6gN1USfKZAgEZgj8N-Kp3M_P5oTQh16S9JcOKpLJ/exec';

  var splash = document.getElementById('splash'), hidden = false, t0 = Date.now();
  function hideSplash() {
    if (hidden) return; hidden = true;
    splash.classList.add('done');
    /* ما نقطع الحركة بنصها: أقل شي ١٫٦ ثانية، وأقصى شي لما يجهز النظام */
    var wait = Math.max(0, 1600 - (Date.now() - t0));
    setTimeout(function () { splash.classList.add('hide'); setTimeout(function () { splash.style.display = 'none'; }, 450); }, wait);
  }
  /* النظام يقول "جاهز" أول ما تظهر شاشة الرمز أو الرئيسية ← نشيل الغطاء على طول */
  window.addEventListener('message', function (e) { if (e.data && e.data.sanad === 'ready') hideSplash(); });

  /* بدون نت: رسالة واضحة بدل صفحة خطأ */
  if (navigator.onLine === false) { document.getElementById('off').classList.add('show'); hideSplash(); }
  else {
    var f = document.createElement('iframe');
    f.id = 'app';
    f.title = 'سند';
    f.allow = 'geolocation; camera; microphone; autoplay; clipboard-write; fullscreen; web-share';
    f.src = APP_URL + '?cover=1';
    f.addEventListener('load', function () { document.getElementById('pc').textContent = 'لحظة…'; setTimeout(hideSplash, 1500); });   // لو ما وصلت "جاهز"
    document.body.appendChild(f);
    setTimeout(hideSplash, 9000);   // احتياط
  }

  /* الاهتزاز: النظام داخل إطار قوقل يطلبه من هنا (المتصفح يمنعه داخل الإطارات) */
  /* إطار قوقل ممكن يوصل بأصل "null" (إطار معزول)، فنقبل الرسالة من أي مصدر —
     والمسموح فيها اهتزاز قصير بس، فما فيها أي خطر */
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.sanad !== 'buzz') return;
    var p = e.data.p;
    if (typeof p === 'number') p = Math.min(Math.max(p, 0), 400);
    else if (Array.isArray(p)) p = p.slice(0, 12).map(function (n) { return Math.min(Math.max(Number(n) || 0, 0), 400); });
    else return;
    try { if (navigator.vibrate) navigator.vibrate(p); } catch (x) {}
  });

  /* مشاركة تقرير الجرد: النظام داخل إطار قوقل يرسل صفحات التقرير (صور)، وهنا نفتح قائمة المشاركة (واتساب)
     المسموح: صور PNG بس (حتى ١٢ صفحة)، والمشاركة نفسها ما تصير إلا بموافقة المستخدم من قائمة الجوال */
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.sanad !== 'share' || !e.source) return;
    var reply = function (o) { o.sanad = 'share-r'; try { e.source.postMessage(o, '*'); } catch (x) {} };
    var list = Array.isArray(e.data.files) ? e.data.files.slice(0, 12) : (e.data.file ? [e.data.file] : []);
    var okType = list.length && list.every(function (f) { return f instanceof Blob && f.type === 'image/png' && f.size <= 15e6; });
    if (!okType) { reply({ ok: false }); return; }
    var files = list.map(function (f, i) { return f instanceof File ? f : new File([f], 'sanad-' + (i + 1) + '.png', { type: 'image/png' }); });
    var text = String(e.data.text || '').slice(0, 300);
    try {
      if (navigator.canShare && navigator.canShare({ files: files })) {
        navigator.share({ files: files, text: text })
          .then(function () { reply({ ok: true }); })
          .catch(function (err) { reply({ ok: false, abort: !!(err && err.name === 'AbortError') }); });
        return;
      }
    } catch (x) {}
    reply({ ok: false, unsupported: true });
  });

  /* التثبيت */
  var bar = document.getElementById('ins'), go = document.getElementById('insGo');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var dismissed = false; try { dismissed = !!localStorage.getItem('sanad_ins_x'); } catch (x) {}
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (!standalone && !dismissed) setTimeout(function () { bar.classList.add('show'); }, 3000);
  });
  go.addEventListener('click', function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; bar.classList.remove('show'); }); }
    else bar.classList.remove('show');
  });
  document.getElementById('insX').addEventListener('click', function () {
    bar.classList.remove('show'); try { localStorage.setItem('sanad_ins_x', '1'); } catch (x) {}
  });
  /* آيفون: ما فيه زر تثبيت تلقائي، نعطيه الطريقة */
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !standalone && !dismissed) {
    document.getElementById('insT').textContent = 'لتثبيت سند: اضغط زر المشاركة تحت ثم "إضافة إلى الشاشة الرئيسية"';
    go.style.display = 'none';
    setTimeout(function () { bar.classList.add('show'); }, 3000);
  }


  /* ═══ إشعارات الجوال (v7.3): النظام داخل إطار قوقل يطلب التفعيل من هنا — الإذن والاشتراك لازم يكونون بالصفحة الأم ═══ */
  var FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var PT = {
    ar: ['فعّل إشعارات سند', 'يوصلك المطلوب منك على الجوال حتى لو التطبيق مسكّر. بعد ما تضغط «فعّل» اختر «السماح».', 'فعّل', 'مو الحين'],
    en: ['Turn on Sanad notifications', "Get what you need to do on your phone even when the app is closed. After tapping «Turn on», choose «Allow».", 'Turn on', 'Not now'],
    bn: ['সানাদ নোটিফিকেশন চালু করুন', 'অ্যাপ বন্ধ থাকলেও আপনার কাজের বার্তা ফোনে পাবেন। «চালু করুন» চাপার পর «Allow» বেছে নিন।', 'চালু করুন', 'এখন না']
  };
  function loadJs(u) { return new Promise(function (res, rej) { var sc = document.createElement('script'); sc.src = u; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
  var pushOk = 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || !e.source) return;
    var src = e.source, reply = function (o) { try { src.postMessage(o, '*'); } catch (x) {} };
    if (d.sanad === 'push?') { reply({ sanad: 'push-info', supported: pushOk, perm: pushOk ? Notification.permission : 'unsupported', standalone: standalone, ios: ios }); return; }
    if (d.sanad !== 'push-on' || !pushOk || !d.cfg || !d.cfg.projectId || typeof d.vapid !== 'string') return;
    var t = PT[d.lang] || PT.ar, box = document.getElementById('psh');
    document.getElementById('pshT').textContent = t[0]; document.getElementById('pshP').textContent = t[1];
    var y = document.getElementById('pshY'), n = document.getElementById('pshN');
    y.textContent = t[2]; n.textContent = t[3]; y.disabled = false;
    box.setAttribute('dir', d.lang === 'en' || d.lang === 'bn' ? 'ltr' : 'rtl');
    box.classList.add('show');
    n.onclick = function () { box.classList.remove('show'); reply({ sanad: 'push-token', ok: false, later: true }); };
    y.onclick = function () {
      y.disabled = true;
      Notification.requestPermission().then(function (perm) {
        if (perm !== 'granted') { box.classList.remove('show'); reply({ sanad: 'push-token', ok: false, perm: perm }); return; }
        return loadJs(FB + 'firebase-app-compat.js').then(function () { return loadJs(FB + 'firebase-messaging-compat.js'); }).then(function () {
          if (!firebase.apps.length) firebase.initializeApp(d.cfg);
          return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; });
        }).then(function (reg) { return firebase.messaging().getToken({ vapidKey: d.vapid, serviceWorkerRegistration: reg }); })
          .then(function (tk) { box.classList.remove('show'); reply({ sanad: 'push-token', ok: !!tk, token: tk || '' }); });
      }).catch(function (err) { box.classList.remove('show'); reply({ sanad: 'push-token', ok: false, err: String((err && err.message) || err).slice(0, 200) }); });
    };
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
