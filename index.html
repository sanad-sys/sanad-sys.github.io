try { var T0 = JSON.parse(localStorage.getItem('sanad_theme') || 'null'), H6 = /^#[0-9a-fA-F]{6}$/;

  } } catch (e) {}

<script>
(function () {
  'use strict';
  /* ═══ الرابط الرسمي لنظام سند — ما يتغير ═══ */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyGpZXFoPyezeBBB3hAcnxDYJXw6gN1USfKZAgEZgj8N-Kp3M_P5oTQh16S9JcOKpLJ/exec';

  var splash = document.getElementById('splash'), hidden = false, t0 = Date.now(), slowT = 0;
  /* رجوع سريع: سند كان ظاهر قبل أقل من ١٠ دقايق (طلعت بزر الرئيسية ورجعت) ← الشعار ثابت بدون الحركة، ويختفي أول ما يجهز سند */
  var QUICK = (function () { try { var t = Number(localStorage.getItem('sanad_cover_seen') || 0); return t > 0 && Date.now() - t < 600000; } catch (x) { return false; } })();
  if (QUICK) splash.classList.add('qk');
  function seen() { try { localStorage.setItem('sanad_cover_seen', String(Date.now())); } catch (x) {} }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') seen(); });
  window.addEventListener('pagehide', seen);
  setInterval(function () { if (document.visibilityState === 'visible') seen(); }, 60000);
  function hideSplash() {
    if (hidden) return; hidden = true; clearTimeout(slowT);
    splash.classList.add('done');
    /* ما نقطع الحركة بنصها: أقل شي ١٫٦ ثانية، وأقصى شي لما يجهز النظام */
    var wait = QUICK ? 0 : Math.max(0, 1600 - (Date.now() - t0));   // الرجوع السريع: بدون انتظار الحركة
    setTimeout(function () { if (!hidden) return; splash.classList.add('hide'); setTimeout(function () { if (hidden) splash.style.display = 'none'; }, 450); }, wait);
  }
  /* النظام يقول "جاهز" أول ما تظهر شاشة الرمز أو الرئيسية ← نشيل الغطاء على طول */
  window.addEventListener('message', function (e) { if (e.data && e.data.sanad === 'ready') hideSplash(); });

  /* لون سند: شريط الحالة (theme-color) والخلفية وcolor-scheme بنفس لون التطبيق، ويتحفظ للفتح الجاي.
     نقبل الرسالة بس من نظام سند نفسه: لازم تجي من داخل إطار التطبيق (#app)، ومن أصل Apps Script
     (script.google.com أو *-script.googleusercontent.com، أو "null" لإطار قوقل المعزول) — والقيم ألوان hex بس */
  function fromApp(e) {
    var app = document.getElementById('app'), aw = app && app.contentWindow, w = e.source;
    if (!aw || !w) return false;
    var inside = false;
    try { for (var i = 0; i < 8 && w; i++) { if (w === aw) { inside = true; break; } if (w === w.parent) break; w = w.parent; } } catch (x) { return false; }
    return inside && (/^https:\/\/(script\.google\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(e.origin) || e.origin === 'null');
  }
  function setTheme(t) {
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t.top);
    var cs = document.querySelector('meta[name="color-scheme"]'); if (cs) cs.setAttribute('content', t.dark ? 'dark' : 'light');
    var r = document.documentElement;
    r.style.setProperty('--sbg', t.bg); r.style.colorScheme = t.dark ? 'dark' : 'light';
    r.classList.toggle('dk', !!t.dark);
  }
  window.addEventListener('message', function (e) {
    var d = e.data, H6 = /^#[0-9a-fA-F]{6}$/;
    if (!d || d.sanad !== 'theme' || !H6.test(d.top) || !H6.test(d.bg) || !fromApp(e)) return;
    var t = { top: d.top, bg: d.bg, dark: d.dark === true };
    setTheme(t);
    try { localStorage.setItem('sanad_theme', JSON.stringify(t)); } catch (x) {}
  });

  /* v8: تحميل سند. قبل: بعد ٩ ثواني شاشة التحميل تختفي حتى لو سند ما طلع ← شاشة فاضية «واقفة» (يصير كثير لما تفتحه بعد فترة: قوقل أبطأ والنت يعلّق).
     الحين: شاشة التحميل تبقى لين سند يقول «جاهز» (أو الإطار يكمّل تحميله) · بعد ١٢ ثانية رسالة وزر «جرّب مرة ثانية» · وبعد ٢٥ ثانية نعيد المحاولة لحالنا مرة وحدة */
  var pc = document.getElementById('pc'), rt = document.getElementById('rt'), tries = 0;
  function showSplash(msg) {
    hidden = false; t0 = Date.now();
    splash.classList.remove('done', 'hide'); splash.style.display = '';
    pc.textContent = msg || 'جاري فتح سند…'; rt.hidden = true;
  }
  function watchSlow() {
    clearTimeout(slowT);
    slowT = setTimeout(function () {
      if (hidden) return;
      pc.textContent = 'سند يتأخر بالفتح… النت بطيء أو قوقل يتأخر'; rt.hidden = false;
      if (tries < 2) slowT = setTimeout(function () { if (!hidden) reloadApp('نعيد المحاولة…'); }, 13000);
    }, 12000);
  }
  function loadApp() {
    tries++;
    var old = document.getElementById('app'); if (old) old.parentNode.removeChild(old);
    var f = document.createElement('iframe');
    f.id = 'app';
    f.title = 'سند';
    f.allow = 'geolocation; camera; microphone; autoplay; clipboard-write; fullscreen; web-share';
    f.src = APP_URL + '?cover=1';
    f.addEventListener('load', function () {   // لو ما وصلت "جاهز" (مثلاً صفحة خطأ من قوقل) نبيّن اللي جا
      if (hidden || document.getElementById('app') !== f) return;
      pc.textContent = 'لحظة…'; setTimeout(function () { if (document.getElementById('app') === f) hideSplash(); }, 1500);
    });
    document.body.appendChild(f);
    watchSlow();
  }
  function reloadApp(msg) { showSplash(msg); loadApp(); }
  rt.addEventListener('click', function () { tries = 0; reloadApp(); });

  /* بدون نت: رسالة واضحة بدل صفحة خطأ */
  if (navigator.onLine === false) { document.getElementById('off').classList.add('show'); hideSplash(); }
  else loadApp();

  /* v8: الرجوع للتطبيق بعد فترة — أندرويد ممكن يسكّر إطار سند بالخلفية (الذاكرة) والغلاف يبقى ← شاشة فاضية لين تسكّر التطبيق.
     نسأل سند «شغّال؟» (ping لكل الإطارات) ولو ما رد خلال ٨ ثواني نعيد تحميله بشاشة التحميل.
     يشتغل بس لو سند رد مرة قبل (سند 9.30 وطالع فيه الرد) — النسخ القديمة ما تنعاد أبد */
  var canPong = false, hidAt = 0, waitP = null;
  function ping(id) {
    var app = document.getElementById('app'), n = 0;
    (function walk(w, d) {
      if (!w || d > 4 || n > 30) return; n++;
      try { w.postMessage({ sanad: 'ping', id: id }, '*'); } catch (x) {}
      var k = 0; try { k = w.length; } catch (x) {}
      for (var i = 0; i < k && i < 10; i++) { var c = null; try { c = w[i]; } catch (x) {} walk(c, d + 1); }
    })(app && app.contentWindow, 0);
  }
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d) return;
    if (d.sanad === 'ready') { setTimeout(function () { ping('hi'); }, 300); return; }   // نعرف هل سند يرد
    if (d.sanad !== 'pong' || !fromApp(e)) return;
    canPong = true;
    if (waitP && d.id === waitP.id) { clearTimeout(waitP.t); waitP = null; }
  });
  function back() {
    var away = hidAt ? Date.now() - hidAt : 0; hidAt = 0;
    if (!canPong || !hidden || away < 60000 || waitP || navigator.onLine === false) return;
    var id = 'p' + Date.now();
    waitP = { id: id, t: setTimeout(function () { waitP = null; if (!document.hidden) reloadApp('نرجّع سند…'); }, 8000) };
    ping(id);
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (!hidAt) hidAt = Date.now(); } else back(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) back(); });

  /* سند 9.40: «إعادة تشغيل سند» — سند (من داخل إطاره بس) يطلب: نرد «restart-r»، نمسح كاش الغلاف ونحدّث الـSW (بدون ما نلغيه — الإشعارات تبقى)،
     وبعد ما تخلص حركة سند (wait) نفتح الصفحة من جديد على آخر نسخة منشورة. الرمز والمسوّدات داخل سند ما تنلمس */
  var restarting = false;
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || d.sanad !== 'restart' || !e.source || !fromApp(e) || restarting) return;
    restarting = true;
    try { e.source.postMessage({ sanad: 'restart-r' }, '*'); } catch (x) {}
    var wait = Math.min(Math.max(Number(d.wait) || 0, 0), 3000), t0 = Date.now(), gone = false;
    var go = function () { if (gone) return; gone = true; try { location.reload(); } catch (x) { location.href = location.pathname; } };
    var clean = Promise.resolve();
    try { if (window.caches && caches.keys) clean = caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }); } catch (x) {}
    try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) clean = clean.then(function () { return navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.update().catch(function () {}); })); }); }); } catch (x) {}
    clean.catch(function () {}).then(function () { setTimeout(go, Math.max(0, wait - (Date.now() - t0))); });
    setTimeout(go, wait + 2500);   // لو المسح علّق
  });

  /* الاهتزاز: النظام داخل إطار قوقل يطلبه من هنا (المتصفح يمنعه داخل الإطارات) */
  /* إطار قوقل ممكن يوصل بأصل "null" (إطار معزول)، فنقبل الرسالة من أي مصدر —
     والمسموح فيها اهتزاز قصير بس، فما فيها أي خطر */
